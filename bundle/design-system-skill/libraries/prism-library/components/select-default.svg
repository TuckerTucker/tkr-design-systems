  <!-- SELECT-DEFAULT -->
  <rect x="0" y="0" width="240" height="44" fill="url(#prism-bg-strip)"/>

  <rect x="0" y="0" width="240" height="44" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.59)" stroke-width="1" rx="14" ry="14"/>
