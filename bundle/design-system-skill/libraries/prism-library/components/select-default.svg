      .text-primary { fill: rgba(255,255,255,0.98); font-family: 'Outfit', sans-serif; }
      .text-secondary { fill: rgba(255,255,255,0.98); font-family: 'Outfit', sans-serif; }
      .text-muted { fill: rgba(255,255,255,0.98); font-family: 'Outfit', sans-serif; }
