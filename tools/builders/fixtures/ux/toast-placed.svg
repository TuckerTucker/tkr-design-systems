<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <defs>
    <style>
      .text-primary { fill: #212121; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .text-secondary { fill: #757575; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .text-inverse { fill: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .text-danger { fill: #B71C1C; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
  </defs>
  <!-- FIXTURE: a toast placed in a composed screen — must FAIL ux-no-toast-notifications -->
  <rect width="600" height="300" fill="#F5F5F5"/>
  <g id="content__card-default_0" transform="translate(24, 24)">
    <rect x="0" y="0" width="360" height="120" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
    <text x="16" y="32" class="text-primary" font-size="16">Settings saved</text>
  </g>
  <g id="notifications__toast-success_0" transform="translate(24, 200)">
    <rect x="0" y="0" width="320" height="56" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
    <text x="16" y="32" class="text-primary" font-size="13">Saved</text>
  </g>
</svg>
