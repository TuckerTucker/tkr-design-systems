<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <style>
      .text-primary { fill: #212121; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .text-secondary { fill: #757575; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .text-inverse { fill: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .text-danger { fill: #B71C1C; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
  </defs>
  <!-- FIXTURE: one marked, one not — proves the indicator is looked for in the declaring part's OWN subtree, not anywhere on the screen -->
  <rect width="400" height="240" fill="#F5F5F5"/>
  <g id="form__label-required_0" transform="translate(24, 24)">
    <text x="0" y="13" class="text-secondary" font-size="12">Email address <tspan class="text-danger">*</tspan></text>
  </g>
  <g id="form__label-required_1" transform="translate(24, 100)">
    <text x="0" y="13" class="text-secondary" font-size="12">Postal code</text>
  </g>
</svg>
