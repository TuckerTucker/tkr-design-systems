<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 44" width="240" height="44">
  <defs>
    <style>
      .text-primary { fill: #111111; font-family: 'Space Mono', monospace; }
      .text-secondary { fill: #666666; font-family: 'Space Mono', monospace; }
      .text-muted { fill: #757575; font-family: 'Space Mono', monospace; }
      .text-inverse { fill: #FFFFFF; font-family: 'Space Mono', monospace; }
      .text-on-accent { fill: #111111; font-family: 'Space Mono', monospace; }
      .text-on-danger { fill: #111111; font-family: 'Space Mono', monospace; }
    </style>
  </defs>
  <!-- ==================== TOAST-ERROR ==================== -->

  <rect x="2" y="2" width="236" height="40" fill="#111111"/>
  <rect x="0" y="0" width="236" height="40" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <rect x="6" y="4" width="50" height="18" fill="#FF3366" stroke="#111111" stroke-width="2"/>
  <text x="31" y="16" text-anchor="middle" class="text-on-danger" font-size="9" font-weight="700" letter-spacing="0.9">ERROR</text>
  <text x="6" y="34" class="text-primary" font-size="9">Something went wrong.</text>
  <text x="230" y="14" text-anchor="end" class="text-secondary" font-size="11" font-weight="700">×</text>

</svg>
