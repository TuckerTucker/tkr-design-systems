<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120">
  <defs>
    <style>
      .text-primary { fill: #2C2C2C; font-family: 'IBM Plex Sans', sans-serif; }
      .text-secondary { fill: #555555; font-family: 'IBM Plex Sans', sans-serif; }
      .text-muted { fill: #6F6B66; font-family: 'IBM Plex Sans', sans-serif; }
      .text-accent { fill: #7C6E8B; font-family: 'IBM Plex Sans', sans-serif; }
      .text-annotation { fill: #7C6E8B; font-family: 'Caveat', cursive; }
    </style>
  </defs>
  <!-- ==================== EMPTY-STATE-DEFAULT ==================== -->

  <g transform="rotate(-2, 160, 56)">
    <text x="160" y="56" text-anchor="middle" class="text-annotation" font-size="17" font-weight="700">fresh page ~</text>
  </g>
  <text x="160" y="84" text-anchor="middle" class="text-muted" font-size="12" letter-spacing="-0.02em">say hello, or just start typing</text>

</svg>
