<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 128" width="480" height="128">
  <defs>
    <style>
      .text-primary { fill: #2C2C2C; font-family: 'IBM Plex Sans', sans-serif; }
      .text-secondary { fill: #555555; font-family: 'IBM Plex Sans', sans-serif; }
      .text-muted { fill: #6F6B66; font-family: 'IBM Plex Sans', sans-serif; }
      .text-accent { fill: #7C6E8B; font-family: 'IBM Plex Sans', sans-serif; }
      .text-annotation { fill: #7C6E8B; font-family: 'Caveat', cursive; }
    </style>
  </defs>
  <!-- ==================== CODE-BLOCK-DEFAULT ==================== -->

  <rect x="0" y="0" width="480" height="128" fill="#FFFFFF" stroke="#E5E3DE" stroke-width="1" rx="10" ry="10"/>
  <text x="16" y="30" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#6F6B66"># enable the derived index</text>
  <text x="16" y="52" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#2C2C2C">tkr koji enable</text>
  <text x="16" y="74" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#2C2C2C">tkr start</text>
  <text x="16" y="96" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#6F6B66"># status: koji-ingest listening</text>

</svg>
