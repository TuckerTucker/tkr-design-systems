<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 40" width="480" height="40">
  <defs>
    <style>
      .text-primary { fill: #2C2C2C; font-family: 'IBM Plex Sans', sans-serif; }
      .text-secondary { fill: #555555; font-family: 'IBM Plex Sans', sans-serif; }
      .text-muted { fill: #6F6B66; font-family: 'IBM Plex Sans', sans-serif; }
      .text-accent { fill: #7C6E8B; font-family: 'IBM Plex Sans', sans-serif; }
      .text-annotation { fill: #7C6E8B; font-family: 'Caveat', cursive; }
    </style>
  </defs>
  <!-- ==================== COMPACTION-MARKER ==================== -->

  <rect x="0" y="0" width="480" height="40" fill="#FAFAF8" stroke="#D5CFC8" stroke-width="1" stroke-dasharray="4 3" rx="10" ry="10"/>
  <text x="240" y="25" text-anchor="middle" class="text-muted" font-size="11" letter-spacing="-0.02em">earlier turns were compacted — <tspan class="text-primary" font-weight="600">load them anyway</tspan></text>

</svg>
