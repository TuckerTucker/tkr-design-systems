<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <style>
      .text-primary { fill: rgba(255,255,255,0.98); font-family: 'Outfit', sans-serif; }
      .text-secondary { fill: rgba(255,255,255,0.87); font-family: 'Outfit', sans-serif; }
      .text-muted { fill: rgba(255,255,255,0.59); font-family: 'Outfit', sans-serif; }
      .text-very-muted { fill: rgba(255,255,255,0.30); font-family: 'Outfit', sans-serif; }
      .text-accent { fill: #9CFFDD; font-family: 'Outfit', sans-serif; }
    </style>
    <linearGradient id="prism-bg-strip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5A4A5E"/>
      <stop offset="1" stop-color="#6B5A5A"/>
    </linearGradient>
  </defs>
  <!-- ICON-CLOSE -->
  <rect x="0" y="0" width="24" height="24" fill="url(#prism-bg-strip)"/>

  <text x="12" y="18" text-anchor="middle" class="text-secondary" font-size="14">×</text>

</svg>
