<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="240" height="48">
  <defs>
    <style>
      .text-primary { fill: rgba(255,255,255,0.98); font-family: 'Outfit', sans-serif; }
      .text-secondary { fill: rgba(255,255,255,0.98); font-family: 'Outfit', sans-serif; }
      .text-muted { fill: rgba(255,255,255,0.66); font-family: 'Outfit', sans-serif; }
      .text-accent { fill: #9CFFDD; font-family: 'Outfit', sans-serif; }
    </style>
    <linearGradient id="prism-bg-strip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5A4A5E"/>
      <stop offset="1" stop-color="#6B5A5A"/>
    </linearGradient>
  </defs>
  <!-- BANNER-ERROR -->
  <rect x="0" y="0" width="240" height="48" fill="url(#prism-bg-strip)"/>

  <rect x="0" y="0" width="240" height="48" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1" rx="12" ry="12"/>
  <circle cx="12" cy="24" r="3" fill="#FFCBC9"/>
  <text x="24" y="20" class="text-secondary" font-size="9" font-weight="600">ERROR</text>
  <text x="24" y="36" class="text-primary" font-size="11">Connection failed.</text>

</svg>
