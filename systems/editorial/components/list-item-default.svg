<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 90" width="280" height="90">
  <defs>
    <style>
      .text-primary { fill: #1A1614; font-family: 'Fraunces', Georgia, serif; }
      .text-secondary { fill: #5C4F44; font-family: 'Fraunces', Georgia, serif; }
      .text-metadata { fill: #77695B; font-family: 'Inter', sans-serif; }
      .text-metadata-accent { fill: #8B1E2D; font-family: 'Inter', sans-serif; }
      .text-accent { fill: #8B1E2D; font-family: 'Fraunces', Georgia, serif; }
      .text-muted { fill: #77695B; font-family: 'Inter', sans-serif; }
      .text-display { fill: #1A1614; font-family: 'Fraunces', Georgia, serif; }
    </style>
  </defs>
  <!-- ==================== LIST-ITEM-DEFAULT ==================== -->

  <!-- Editorial list item — default state
       Per project no-emoji policy: metadata is timestamp only; identity
       comes from the Fraunces title and (when present) the burgundy 'N new'.
       Top: timestamp in Inter uppercase tracked
       Optional 'N new' top-right in Fraunces burgundy (only when unread)
       Title: Fraunces 15px weight 600
       Preview: Inter italic 11px in color.text_secondary
       Hairline rule below
  -->

  <!-- Background: paper (cream) — same as page so transparent in composition -->
  <rect x="0" y="0" width="280" height="90" fill="#F8F4EC"/>

  <!-- Timestamp + emoji overline: Inter uppercase tracked
       Per editorial-tracked-metadata: 9px, 0.16em (1.44px) tracking, color color.text_muted
  -->
  <text x="16" y="22"
        font-family="'Inter', sans-serif"
        font-size="9"
        font-weight="600"
        fill="#77695B"
        letter-spacing="1.44">2M AGO · DISPATCH</text>

  <!-- Unread "2 new" — Fraunces burgundy, NOT a badge per rulebook -->
  <text x="264" y="22"
        font-family="'Fraunces', Georgia, serif"
        font-size="11"
        font-weight="700"
        fill="#8B1E2D"
        text-anchor="end">2 new</text>

  <!-- Title: Fraunces 15px weight 600, slight negative tracking -->
  <text x="16" y="46"
        font-family="'Fraunces', Georgia, serif"
        font-size="15"
        font-weight="600"
        fill="#1A1614"
        letter-spacing="-0.15">Tokyo Trip</text>

  <!-- Preview: Inter italic 11px in color.text_secondary -->
  <text x="16" y="66"
        font-family="'Inter', sans-serif"
        font-size="11"
        font-style="italic"
        font-weight="400"
        fill="#5C4F44">Want me to build a day-by-day itinerary?</text>

  <!-- Hairline rule below -->
  <line x1="0" y1="89" x2="280" y2="89" stroke="#E8DFCA" stroke-width="1"/>

</svg>
